name: CI
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [greek_subtitles, aiostreams, aiometadata]
    steps:
      - uses: actions/checkout@v5
      - name: Home Assistant app linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.app }}
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax
        run: node --check greek_subtitles/rootfs/ha-start.js
      - name: Both apps ship the same launcher
        run: cmp greek_subtitles/rootfs/ha-start.js aiostreams/rootfs/ha-start.js && cmp greek_subtitles/rootfs/ha-start.js aiometadata/rootfs/ha-start.js
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [greek_subtitles, aiostreams, aiometadata]
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build exactly like the Supervisor (docker buildx, --pull, per-arch platform, no build.yaml)
        run: |
          test ! -f ${{ matrix.app }}/build.yaml
          PLAT=$([ "${{ matrix.arch }}" = aarch64 ] && echo linux/arm64 || echo linux/amd64)
          cd ${{ matrix.app }} && docker buildx build . --file Dockerfile --platform $PLAT --pull \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/base:latest --build-arg BUILD_ARCH=${{ matrix.arch }} --load -t test
