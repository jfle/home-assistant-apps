name: AIOStreams (Greek setup)
version: "2.38.1"
slug: aiostreams
description: AIOStreams with HTTPS, outside access and the Greek-subtitles templates, ready for the Greek Subtitles app
url: https://github.com/jfle/home-assistant-apps/tree/main/aiostreams
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
hassio_api: true
ports:
  8454/tcp: 8454
ports_description:
  8454/tcp: HTTPS for Stremio (forward this port on your router to watch outside home)
watchdog: tcp://[HOST]:[PORT:8454]
options:
  public_access: true
  public_ip: auto
  public_port: 8454
  admin_user: admin
  auth_required: false
schema:
  public_access: bool
  public_ip: str
  public_port: port
  public_url: str?
  lan_ip: str?
  admin_user: str
  admin_password: password?
  auth_required: bool
  base_url: str?
